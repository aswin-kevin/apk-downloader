name: Release

# Pushing a tag like v2.0.0 stages that version on npm. Nothing goes live until a maintainer
# approves it on npmjs.com (Staged Packages tab) with 2FA. Authentication is OIDC trusted
# publishing: there is no npm token in this repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage on npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in the release job, so a poisoned cache cannot reach a release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm >= 11.15.0. Pinned to an exact, settled release.
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@11.21.1 && npm --version

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # .npmrc sets ignore-scripts=true, so no dependency lifecycle scripts run here.
      - run: npm ci

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Typecheck, lint, format check, unit tests
        run: npm run verify

      - run: npm run build

      - name: Check package contents
        run: npm run check:pack

      - name: Stage the release (approve it on npmjs.com)
        run: npm stage publish
