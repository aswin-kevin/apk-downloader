name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # .npmrc sets ignore-scripts=true, so no dependency lifecycle scripts run here.
      - run: npm ci

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=moderate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Smoke-test the packed CLI
        run: |
          npm pack
          node bin/apk-downloader.js --version
